
variables:
  FULL_IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH:$CI_PIPELINE_ID
  SECURE_ANALYZERS_PREFIX: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
  DS_EXCLUDED_ANALYZERS: ""
  DS_EXCLUDED_PATHS: "spec, test, tests, tmp"
  DS_MAJOR_VERSION: 4
  DS_SCHEMA_MODEL: 15

stages:
  - security-test

Secrets Detector:
  stage: security-test
  image:
    name: registry.gitlab.com/gitlab-org/security-products/analyzers/secrets:6
  needs: []
  variables:
    GIT_DEPTH: "50"
  script:
    - /analyzer run
    # - if [[ $(cat gl-secret-detection-report.json | jq '.vulnerabilities | length > 0') ]]; then echo "secrets found" && exit 1; fi
  allow_failure: true
  only:
    - merge_requests
    - main  
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-detection-report.json

Checkmarx Dockerfile:
  stage: security-test
  image: 
    name: checkmarx/kics:latest
    entrypoint: [""]
  needs: []  
  variables:
    DEPLOYMENT_PATH: Dockerfile
  script:
    - kics scan -p $DEPLOYMENT_PATH -o ${PWD} -t Dockerfile --ignore-on-exit all --report-formats glsast --output-name docker_file --ci
  only:
    - merge_requests
    - main
  allow_failure: true
  artifacts:
    reports:
      sast: gl-sast-docker_file.json
    when: always  



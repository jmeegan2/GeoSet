variables:
  CODE_DIRECTORY: ./
  DAST_SCAN_ENABLED: "true"
  MAIN_BRANCH: "main"

default:
  tags:
    - live-dart-development

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
      # The injected Sign Image job expects this legacy tag shape:
      # $CI_REGISTRY/$CI_PROJECT_PATH:$SPRINT_NUMBER.$VALUE_INCREMENT.
      # Use the pipeline ID as SPRINT_NUMBER so each signed image tag is unique.
      variables:
        SPRINT_NUMBER: "$CI_PIPELINE_ID"
        VALUE_INCREMENT: "release"
        FULL_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$SPRINT_NUMBER.$VALUE_INCREMENT"
    - when: always
      variables:
        FULL_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_PIPELINE_ID"
        
stages:
  - build
  - security-test

Build Dev Image and Push to Registry:
  image:
    name: quay.io/buildah/stable:v1.35.3
  stage: build
  needs:
    - job: Build Base Image and Push to Registry
      optional: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - export STORAGE_DRIVER=vfs
    # Pass version as build argument
    - buildah build --no-cache --build-arg BUILD_VERSION="$CI_PIPELINE_ID" --target production -t $FULL_IMAGE_NAME .
    - buildah push $FULL_IMAGE_NAME
    - echo "FULL_IMAGE_NAME=$FULL_IMAGE_NAME" > security.env
    - echo "CS_IMAGE=$FULL_IMAGE_NAME" >> security.env
  artifacts:
    reports:
      dotenv: security.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        FULL_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_PIPELINE_ID"

Build Release Image and Push to Registry:
  image:
    name: quay.io/buildah/stable:v1.35.3
  stage: build
  needs:
    - job: Build Base Image and Push to Registry
      optional: true
  script:
    - set -x
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - export STORAGE_DRIVER=vfs
    - RELEASE_TAG="$SPRINT_NUMBER.$VALUE_INCREMENT"
    - echo "Building release image with tag $RELEASE_TAG"
    # Bake the same version string that the signed/deployed image tag uses.
    - buildah build --no-cache --build-arg BUILD_VERSION="$RELEASE_TAG" --target production -t $FULL_IMAGE_NAME .
    - buildah push $FULL_IMAGE_NAME
    - echo "FULL_IMAGE_NAME=$FULL_IMAGE_NAME" > security.env
    - echo "CS_IMAGE=$FULL_IMAGE_NAME" >> security.env
  artifacts:
    reports:
      dotenv: security.env
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH

Trivy Container Scan:
  image:
    name: aquasec/trivy:0.68.1
    entrypoint: [""]
  stage: security-test
  needs:
    - job: Build Dev Image and Push to Registry
      optional: true
    - job: Build Release Image and Push to Registry
      optional: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 "$FULL_IMAGE_NAME"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH

